name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Compile source
        run: python -m compileall -q paper_search_cli tests

      - name: Run deterministic tests
        run: >
          python -m pytest
          tests/test_cli_contracts.py
          tests/test_package_entrypoints.py
          tests/test_cli_sort.py
          tests/test_cli_tools.py
          tests/test_operations.py::TestPaperOperations
          tests/test_feature_integration.py
          tests/test_cli_sources.py
          tests/test_wos.py
          tests/test_scopus.py
          tests/test_institutional_http.py
          tests/test_semantic_rate_limits.py
          tests/test_semantic_pdf_validation.py
          tests/test_cli_diagnostics.py
          tests/test_config_env.py
          tests/test_unpaywall.py
          tests/test_unpaywall_source.py
          tests/test_tool_schema_compat.py
          tests/test_stabilization_regressions.py
          tests/test_search_timeouts.py
          tests/test_google_scholar_errors.py
          tests/test_arxiv_406.py
          tests/test_arxiv.py::TestArxivRateLimiting
          tests/test_biorxiv_search_modes.py
          tests/test_openreview.py
          tests/test_ssrn_openalex.py
          tests/test_ssrn.py
          tests/test_openalex.py
          tests/test_openalex_relations.py
          tests/test_sections.py
          tests/test_search_cache.py
          tests/test_ieee.py
          tests/test_skill_archive_docs.py
          tests/test_skill_zip_builder.py
          tests/test_acm.py
          tests/test_fallback.py
          tests/test_paper.py
          -q --tb=short

  wheel:
    name: CLI wheel (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: macos-latest
            python: '3.12'
          - os: windows-latest
            python: '3.13'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v4
      - run: uv build --wheel
      - name: Exercise the installed CLI without MCP
        shell: bash
        run: uv run --isolated --no-project --python '${{ matrix.python }}' --with "$(echo dist/*.whl)" --with pytest python -m pytest tests/test_cli_contracts.py tests/test_package_entrypoints.py -q
