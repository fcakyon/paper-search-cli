[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paper-search-cli"
version = "0.2.0"
authors = [{ name = "P.S Zhang", email = "pengsongzhang96@gmail.com" }]
description = "Search, download and read academic papers from the command line."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = [
    "academic",
    "papers",
    "search",
    "arxiv",
    "pubmed",
    "semantic-scholar",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "requests",
    "feedparser",
    "pypdf",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.12,<3",
]

[project.optional-dependencies]
proxy = ["requests[socks]"]
dev = [
    "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/fcakyon/paper-search-cli"
Repository = "https://github.com/fcakyon/paper-search-cli"
Issues = "https://github.com/fcakyon/paper-search-cli/issues"

[project.scripts]
paper-search = "paper_search_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["paper_search_cli"]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
